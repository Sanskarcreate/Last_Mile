<DOCTYPE html>
<html lang="eng">

<head>
    <title>Register - Last Mile</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/register.js" defer></script><!--this here is a link to link both regioster html and js together so the js copde will work the way it is supposed to do.-->
    <style> 
         body{
            background-color: #202c45;
         }

         
</style>
</head>

<body>
<!--the classes here are here for the way that the register page is going to look like as well as the contents within the register page.-->
    <div class="register">
        <h1>LAST MILE</h1>
        <h2 style="color: white;">Create Account</h2>
        <p style="color: white;">Join the race!!</p>

        <form id="register-form" novalidate>
            <input type="text" id="username" placeholder="Username">
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Password">
            <input type="password" id="confirm" placeholder="Comfirm Password">

            <button type="button" id="register-button">Register</button>

            <p id="message"></p>
        </form>

        <p>Already have an Account?</p><!--this paragraph here is so that the users are able to click on teh login link to log into there account.-->
        <a href="login.html" style="color: sandybrown;">Login</a>
    </div>

</body>
</html>
