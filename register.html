<DOCTYPE html>
<html lang="eng">

<head>
    <title>Register - Last Mile</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/register.js" defer></script>
</head>
<style>
    body{
         background-color: #202c45;
    }
</style>
<body>

    <div class="register">
        <h1>LAST MILE</h1>
        <h2 style="color: white;">Create Account</h2>
        <p style="color: white;">Join the race!!</p>

        <form id="register-form" novalidate>
            <input type="text" id="username" placeholder="Username">
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Password">
            <input type="password" id="confirm" placeholder="Comfirm Password">

            <button type="button" id="register-button">Register</button>

            <p id="message"></p>
        </form>

        <p>Already have an Account?</p>
        <a href="login.html" style="color: sandybrown;">Login</a>
    </div>

</body>
</html>
